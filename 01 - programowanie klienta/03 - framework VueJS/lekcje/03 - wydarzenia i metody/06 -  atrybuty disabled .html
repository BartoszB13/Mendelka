<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
    <style>
      .row {
        display: flex;
        gap: 10px;
      }

      .row + .row {
        margin-top: 10px;
      }

      .row > button {
        width: 40px;
        aspect-ratio: 1;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        flex-shrink: 0;
      }
      .disabled {
        color: lightgray;
      }
      .active {
        color: green;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <select v-model="selectedType">
        <option value="">Wybierz grupe</option>
        <option v-for="(price,type) in prices" :value="type" :key="type">
          {{type}}
        </option>
      </select>
      <div v-for="row in Venue" class="row">
        <button
          v-for="seat in row"
          :key="seat.id"
          :disabled="isDisabled(seat.zone)"
          :class="isDisabled(seat.zone) ? 'disabled' : 'active'"
          v-on:click="buySeat(seat)"
        >
          {{seat.id}}
        </button>
      </div>
      <div v-if="basket.length>0">
        <h1>Koszyk</h1>
        <p>Suma całkowita {{totalCost}}PLN</p>
        <ul>
          <li v-for="boughtSeat in basket">
            {{boughtSeat.id}} | Strefa
            {{boughtSeat.zone}}({{boughtSeat.price}}PLN)
          </li>
        </ul>
      </div>
      <p v-else>Brak Produktów</p>
    </div>
    <script>
      const app = Vue.createApp({
        data() {
          return {
            disabled: false,
            basket: [],
            selectedType: "",
            totalCost: 0,
            prices: {
              VIP: 250,
              Standard: 150,
              Balkon: 80,
            },
            Venue: [
              [
                { id: "A1", zone: "Standard" },
                { id: "A2", zone: "Standard" },
                { id: "A3", zone: "VIP" },
                { id: "A4", zone: "VIP" },
                { id: "A5", zone: "VIP" },
                { id: "A6", zone: "VIP" },
                { id: "A7", zone: "VIP" },

                { id: "A9", zone: "Standard" },

                { id: "B8", zone: "VIP" },
                { id: "B9", zone: "Standard" },
                { id: "B10", zone: "Standard" },
              ],
              [
                { id: "C1", zone: "Standard" },
                { id: "C2", zone: "Standard" },
                { id: "C3", zone: "Standard" },
                { id: "C4", zone: "Standard" },
                { id: "C5", zone: "Standard" },
                { id: "C6", zone: "Standard" },
                { id: "C7", zone: "Standard" },
                { id: "C8", zone: "Standard" },
                { id: "C9", zone: "Standard" },
                { id: "C10", zone: "Standard" },
              ],
              [
                { id: "D1", zone: "Standard" },
                { id: "D2", zone: "Standard" },
                { id: "D3", zone: "Standard" },
                { id: "D4", zone: "Standard" },
                { id: "D5", zone: "Standard" },
                { id: "D6", zone: "Standard" },
                { id: "D7", zone: "Standard" },
                { id: "D8", zone: "Standard" },
                { id: "D9", zone: "Standard" },

              ],

          };
        },
        methods: {
          isDisabled(seatZone) {
            return seatZone !== this.selectedType;
          },
          buySeat(seat) {
            const seatPrice = Number(this.prices[seat.zone]);

            this.totalCost += seatPrice;

            this.basket.push({
              ...seat,
              price: this.prices[seat.zone],
            });

            alert(seatPrice);
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
