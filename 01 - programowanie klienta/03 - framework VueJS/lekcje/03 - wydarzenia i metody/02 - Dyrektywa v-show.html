<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <h3 v-show="show">element</h3>
      <button v-on:click="showElement">Pokaz ukryj</button>
    </div>
    <script>
      const app = Vue.createApp({
        data() {
          return {
            show: false,
            items: [
              { text: "element 1", checked: true },
              { text: "element 2", checked: false },
              { text: "element 3", checked: false },
            ],
          };
        },
        methods: {
          showElement(element) {
            if (this.show) {
              return (this.show = false);
            }
            return (this.show = true);
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
