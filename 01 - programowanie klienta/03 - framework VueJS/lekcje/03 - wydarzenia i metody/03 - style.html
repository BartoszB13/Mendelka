<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
    <style>
      .active {
        color: red;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <ul>
        <li v-for="item in items" v-bind:class="{ 'active':item.checked}">
          <input type="checkbox" v-model="item.checked" />{{item.text}}
        </li>
      </ul>
      <input type="text" v-model="nazwa" />
      <button v-on:click="newItem">Dodaj Przedmiot</button>
    </div>
    <script>
      const app = Vue.createApp({
        data() {
          return {
            nazwa: "",
            items: [
              { text: "element 1", checked: true },
              { text: "element 2", checked: false },
              { text: "element 3", checked: false },
            ],
          };
        },
        methods: {
          newItem() {
            const Item = { text: this.nazwa, checked: false };
            this.items.push(Item);
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
