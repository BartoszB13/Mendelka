<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper</title>

    <style>
      .tile {
        border: 1px solid;
        width: 24px;
        height: 24px;
        float: left;
        box-sizing: border-box;
        text-align: center;
        line-height: 24px;
        cursor: pointer;
        user-select: none;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      body > * {
        margin: 1em;
      }

      #usernameForm {
        display: flex;
        flex-direction: row;
      }
      #usernameForm > * {
        margin: 4px;
      }

      #timer {
        border: 1px solid black;
      }

      #timer {
        background: #f4f4f4;
        border: 1px solid #222;
        border-radius: 6px;

        font-family: "Courier New", monospace;
        font-size: 32px;
        font-weight: bold;
        font-variant-numeric: tabular-nums;
        letter-spacing: 3px;
        text-align: center;
        line-height: 1;
      }

      #timer:empty {
        display: none;
      }

      #form {
        display: flex;
        flex-direction: column;
        border: 1px solid black;
        padding: 16px;
        margin: 1em;
      }

      #form > * {
        margin-bottom: 1em;
      }

      #leaderboard {
        border: 1px solid black;
        padding: 4px;
      }

      #leaderboard > * {
        border: 1px solid black;
        margin: 4px;
        padding: 4px;
      }

      #leaderboard > :first-child {
        color: red;
      }

      #leaderboard:empty {
        display: none;
      }
    </style>
  </head>

  <body>
    <script>
      let isGameOngoing = true;
      let gameBoard = [];
      let minePositions = [];

      let revealedTilesCount = 0;
      let tilesToWin;

      let gameBeginning = 0;
      let timerInterval = null;

      // Inicjalizacja formularza i kontenerów
      function init() {
        const boardContainer = document.createElement("div");
        boardContainer.id = "board";

        const boardSizeInput = document.createElement("input");
        boardSizeInput.type = "number";
        boardSizeInput.min = 4;
        boardSizeInput.value = 10;

        const mineCountInput = document.createElement("input");
        mineCountInput.type = "number";
        mineCountInput.min = 1;
        mineCountInput.value = 10;

        const controlsContainer = document.createElement("div");
        controlsContainer.id = "form";

        const boardSizeLabel = document.createTextNode("Rozmiar planszy: ");
        const mineCountLabel = document.createTextNode("Bomby: ");

        const generateButton = document.createElement("button");
        generateButton.innerText = "GENERUJ!";

        const clearCookiesButton = document.createElement("button");
        clearCookiesButton.id = "clearCookiesButton";
        clearCookiesButton.innerText = "Wyczyść wszystkie cookies";

        clearCookiesButton.onclick = function () {
          deleteAllCookies();
          updateLeaderboard();
        };

        // Kontener leaderboardu tworzymy tylko raz.
        const leaderboardContainer = createLeaderboard();

        const timer = document.createElement("div");
        timer.id = "timer";

        generateButton.onclick = function () {
          const mineCount = Number(mineCountInput.value);
          const boardSize = Number(boardSizeInput.value);

          if (
            !Number.isInteger(boardSize) ||
            boardSize < 4 ||
            boardSize * boardSize <= mineCount
          ) {
            alert("Wpisz poprawny rozmiar planszy!");
            return;
          }

          if (!Number.isInteger(mineCount) || mineCount <= 0) {
            alert("Wpisz co najmniej jedną bombę!");
            return;
          }

          tilesToWin = boardSize ** 2 - mineCount;
          revealedTilesCount = 0;
          isGameOngoing = true;

          updateTime(timer);
          generateGameBoard(boardSize);
          placeMines(mineCount);
          renderBoard(mineCount, boardSize);
        };

        controlsContainer.append(
          boardSizeLabel,
          boardSizeInput,
          mineCountLabel,
          mineCountInput,
          clearCookiesButton,
          generateButton,
          timer,
        );

        document.body.append(
          controlsContainer,
          boardContainer,
          leaderboardContainer,
        );

        // Odczyt zapisanych wyników po dodaniu kontenera do strony.
        updateLeaderboard();
      }

      // Generowanie planszy 2D
      function generateGameBoard(boardSize) {
        gameBoard = [];

        for (let row = 0; row < boardSize; row++) {
          gameBoard[row] = [];

          for (let column = 0; column < boardSize; column++) {
            gameBoard[row][column] = 0;
          }
        }
      }

      // Rozmieszczenie min
      function placeMines(mineCount) {
        minePositions = [];

        while (minePositions.length < mineCount) {
          const column = Math.floor(Math.random() * gameBoard.length);
          const row = Math.floor(Math.random() * gameBoard.length);

          if (gameBoard[row][column] === 0) {
            gameBoard[row][column] = 1;

            const minePosition = { column, row };
            minePositions.push(minePosition);
          }
        }
      }

      // Wyświetlenie planszy
      function renderBoard(mineCount, boardSize) {
        const boardContainer = document.getElementById("board");

        boardContainer.innerHTML = "";
        boardContainer.style.width = gameBoard.length * 25 + "px";

        for (let row = 0; row < gameBoard.length; row++) {
          for (let column = 0; column < gameBoard[row].length; column++) {
            const tile = document.createElement("div");

            tile.dataset.column = column;
            tile.dataset.row = row;
            tile.dataset.revealed = "false";
            tile.classList.add("tile");

            tile.addEventListener("click", function () {
              if (!isGameOngoing) return;
              if (this.dataset.revealed === "true") return;
              if (this.style.backgroundColor === "green") return;

              const tileColumn = Number(this.dataset.column);
              const tileRow = Number(this.dataset.row);

              if (gameBoard[tileRow][tileColumn] === 1) {
                gameLost();
                return;
              }

              revealTile(tileRow, tileColumn);

              if (tilesToWin === revealedTilesCount) {
                gameWon(mineCount, boardSize);
              }
            });

            tile.addEventListener("contextmenu", function (event) {
              event.preventDefault();

              if (!isGameOngoing) return;
              if (this.dataset.revealed === "true") return;

              const isFlagged = this.style.backgroundColor === "green";

              if (!isFlagged) {
                this.style.backgroundColor = "green";
              } else {
                this.style.backgroundColor = "";
              }
            });

            boardContainer.appendChild(tile);
          }
        }
      }

      // Sprawdzenie, czy pole znajduje się na planszy
      function isInsideBoard(row, column) {
        return (
          row >= 0 &&
          row < gameBoard.length &&
          column >= 0 &&
          column < gameBoard.length
        );
      }

      // Pobranie elementu odpowiadającego polu
      function getTileElement(row, column) {
        return document.querySelector(
          `[data-column="${column}"][data-row="${row}"]`,
        );
      }

      // Odsłonięcie pola
      function revealTile(row, column) {
        if (!isInsideBoard(row, column)) return;

        const tile = getTileElement(row, column);

        if (tile.dataset.revealed === "true") return;
        if (tile.style.backgroundColor === "green") return;

        tile.dataset.revealed = "true";
        tile.style.backgroundColor = "#ddd";

        revealedTilesCount += 1;

        const minesAround = countMinesAround(column, row);

        if (minesAround > 0) {
          tile.innerText = minesAround;
          return;
        }

        for (let rowOffset = -1; rowOffset <= 1; rowOffset++) {
          for (let columnOffset = -1; columnOffset <= 1; columnOffset++) {
            revealTile(row + rowOffset, column + columnOffset);
          }
        }
      }

      // Liczenie min wokół pola
      function countMinesAround(column, row) {
        let minesAround = 0;

        for (let rowOffset = -1; rowOffset <= 1; rowOffset++) {
          for (let columnOffset = -1; columnOffset <= 1; columnOffset++) {
            if (rowOffset === 0 && columnOffset === 0) continue;

            const neighbourColumn = column + columnOffset;
            const neighbourRow = row + rowOffset;

            if (
              isInsideBoard(neighbourRow, neighbourColumn) &&
              gameBoard[neighbourRow][neighbourColumn] === 1
            ) {
              minesAround++;
            }
          }
        }

        return minesAround;
      }

      // Przegrana
      function gameLost() {
        if (!isGameOngoing) return;

        isGameOngoing = false;

        minePositions.forEach((minePosition) => {
          const mineTile = getTileElement(
            minePosition.row,
            minePosition.column,
          );

          mineTile.style.backgroundColor = "red";
        });

        const finishingTime = stopTimer();

        alert(
          `Gra przegrana! Końcowy czas: ` +
            `${finishingTime.minutes}:${finishingTime.seconds}.${finishingTime.miliseconds}`,
        );
      }

      // Wygrana
      function gameWon(mineCount, boardSize) {
        if (!isGameOngoing) return;

        isGameOngoing = false;

        // Zatrzymujemy czas przed oczekiwaniem na nazwę użytkownika.
        const getFinishingTimeValues = stopTimer();
        const finishingTime =
          String(getFinishingTimeValues.minutes).padStart(2, "0") +
          ":" +
          String(getFinishingTimeValues.seconds).padStart(2, "0") +
          "." +
          String(getFinishingTimeValues.miliseconds).padStart(3, "0");

        const usernameContainer = document.createElement("div");
        const message = document.createElement("p");
        const usernameInput = document.createElement("input");
        usernameInput.placeholder = "Wpisz nazwe użytkownika";

        usernameInput.style.display = "block";

        const submitUsernameButton = document.createElement("button");
        submitUsernameButton.innerText = "Prześlij";

        submitUsernameButton.onclick = function () {
          const username = usernameInput.value;

          message.innerText = `Dziękujemy ${username} za przesłanie wyniku.`;

          saveScore(finishingTime, mineCount, boardSize, username);

          // Aktualizujemy istniejące wiersze zamiast tworzyć nowy kontener.
          updateLeaderboard();

          submitUsernameButton.disabled = true;
          usernameContainer.remove();

          setTimeout(function () {
            message.remove();
          }, 5000);
        };

        usernameContainer.append(usernameInput, submitUsernameButton);
        usernameContainer.id = "usernameForm";

        document.body.append(usernameContainer, message);

        alert(`Gra wygrana! Końcowy czas: ` + `${finishingTime}`);
      }

      // Aktualny czas gry
      function getTime() {
        const overallTimeInSec = Math.floor(
          (Date.now() - gameBeginning) / 1000,
        );

        const minutes = Math.floor(overallTimeInSec / 60);
        const seconds = overallTimeInSec % 60;
        const miliseconds = Math.round(
          ((Date.now() - gameBeginning) / 1000 - seconds) * 1000,
        );

        console.log(miliseconds);

        return { minutes, seconds, overallTimeInSec, miliseconds };
      }

      function updateTime(timer) {
        clearInterval(timerInterval);

        gameBeginning = Date.now();
        timer.textContent = "00" + ":" + "00";

        timerInterval = setInterval(() => {
          const time = getTime();
          timer.textContent =
            String(time.minutes).padStart(2, "0") +
            ":" +
            String(time.seconds).padStart(2, "0");
        }, 250);
      }

      function stopTimer() {
        clearInterval(timerInterval);

        const finalTime = getTime();

        return finalTime;
      }

      // Odczyt leaderboardu z cookie
      function getLeaderboard() {
        const cookies = document.cookie.split(";");

        for (let cookie of cookies) {
          cookie = cookie.trim();

          if (cookie.startsWith("leaderboard=")) {
            const cookieValue = cookie.substring("leaderboard=".length);

            try {
              const leaderboard = JSON.parse(decodeURIComponent(cookieValue));

              return Array.isArray(leaderboard) ? leaderboard : [];
            } catch {
              return [];
            }
          }
        }

        return [];
      }

      // Wywołujemy tylko raz, w init().
      function createLeaderboard() {
        const leaderboardContainer = document.createElement("div");
        leaderboardContainer.id = "leaderboard";

        return leaderboardContainer;
      }

      // Używamy tego samego kontenera i istniejących wierszy.
      function updateLeaderboard() {
        const leaderboardContainer = document.getElementById("leaderboard");
        const leaderboard = getLeaderboard();

        leaderboard.forEach((player, index) => {
          let leaderboardRow = leaderboardContainer.children[index];

          // Nowy element powstaje tylko wtedy, gdy brakuje wiersza.
          if (!leaderboardRow) {
            leaderboardRow = document.createElement("div");
            leaderboardContainer.appendChild(leaderboardRow);
          }

          const rowText =
            `${index + 1}. Nazwa użytkownika: ${player.username ?? "—"}, ` +
            `Czas: ${player.score}[m:s.ms], ` +
            `Liczba bomb: ${player.bombCount}, ` +
            `Rozmiar planszy: ${player.GameMode ?? "—"}`;

          // Zmieniamy tekst tylko wtedy, gdy wynik na tej pozycji się zmienił.
          if (leaderboardRow.textContent !== rowText) {
            leaderboardRow.textContent = rowText;
          }
        });

        // Usuwamy nadmiarowe wiersze, np. po wyczyszczeniu cookies.
        while (leaderboardContainer.children.length > leaderboard.length) {
          leaderboardContainer.lastElementChild.remove();
        }
      }

      // Dodawanie wyniku i zapis leaderboardu do cookie
      function saveScore(score, mineCount, boardSize, username) {
        const leaderboard = getLeaderboard();

        leaderboard.push({
          score: score,
          bombCount: mineCount,
          // Zachowane nazwy pól zapewniają odczyt starszych cookies.
          // GameMode przechowuje długość boku planszy.
          GameMode: boardSize,
          username: username,
        });

        // Najpierw więcej bomb, przy remisie krótszy czas.
        leaderboard.sort(
          (a, b) => b.bombCount - a.bombCount || a.score - b.score,
        );

        const topScores = leaderboard.slice(0, 10);
        const cookieValue = encodeURIComponent(JSON.stringify(topScores));

        // Zapis na 4 minuty, zgodnie z wcześniejszym kodem.
        document.cookie = "leaderboard=" + cookieValue + "; max-age=" + 60 * 4;

        return topScores;
      }

      // Source: https://stackoverflow.com/a/179514
      // Posted by Robert J. Walker, modified by community.
      // Retrieved 2026-11-14, License: CC BY-SA 4.0
      // Usuwa dostępne dla JS cookies na domyślnej ścieżce i na "/".
      function deleteAllCookies() {
        document.cookie.split(";").forEach((cookie) => {
          const equalsPosition = cookie.indexOf("=");

          const cookieName = (
            equalsPosition > -1 ? cookie.substring(0, equalsPosition) : cookie
          ).trim();

          if (!cookieName) return;

          document.cookie = cookieName + "=; max-age=0";
          document.cookie = cookieName + "=; max-age=0; path=/";
        });
      }

      function getCookie(cookieName) {
        const cookiePrefix = cookieName + "=";
        const cookies = document.cookie.split(";");

        for (let cookie of cookies) {
          cookie = cookie.trim();

          if (cookie.startsWith(cookiePrefix)) {
            return decodeURIComponent(cookie.substring(cookiePrefix.length));
          }
        }

        return "";
      }

      init();
    </script>
  </body>
</html>
