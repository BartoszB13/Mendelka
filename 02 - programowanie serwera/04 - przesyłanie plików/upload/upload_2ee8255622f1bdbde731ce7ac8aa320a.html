<!-- ============================================================
     1) Animacja zwijania / rozwijania przy SORTOWANIU
        (model 1:1 z artefaktu „Grafik — Docelowy Widok”)
     2) Siatka tygodnia mieszcząca 7 dni bez przewijania w bok
     ============================================================ -->
<style>
  :root {
    --sortanim-ease-out: cubic-bezier(.22,.61,.36,1);
    --sortanim-ease-in-out: cubic-bezier(.65,0,.35,1);
  }
  .sortanim-ghost { position: fixed !important; pointer-events: none !important; z-index: 60 !important; overflow: hidden !important; margin: 0 !important; }
  /* Duch nigdy nie rozciąga wierszy — bez tego kopia z mniejszą liczbą
     wierszy niż zamrożona wysokość rozjeżdżała się na całą kartę. */
  .sortanim-ghost { align-content: start !important; }

  /* ---- Widok Grafik: zawsze 7 dni w kadrze --------------------------
     Było: minmax(148px,.9fr) repeat(7, minmax(92px,1fr)) + min-width:
     fit-content → twarde minimum ~856px, więc przy węższym oknie
     (100% zoom na 1280/1366) siatka wyjeżdżała w poziomy scroll i
     widoczne było tylko 5 dni. Teraz kolumny dni mogą się realnie
     kurczyć (minmax(0,1fr)), a kontener nie wymusza własnej szerokości. */
  /* Kolumny mają TWARDĄ podłogę (72px dzień / 124px kolumna imion) — to
     jest obecny, minimalny rozmiar komórki i poniżej niego siatka już się
     nie kurczy. Wcześniejsze `minmax(0,1fr)` pozwalało zjeżdżać w
     nieskończoność, co przy zoomie >100% dawało migotanie i zapadanie się
     komórek. Gdy okno jest węższe niż ta podłoga (zoom 110%+), siatka po
     prostu wystaje, a `.grid-scroll` pokazuje poziomy suwak. */
  .v1-grid, .coverage-strip {
    grid-template-columns: minmax(124px, .85fr) repeat(7, minmax(72px, 1fr)) !important;
    gap: 6px !important;
    min-width: 0 !important;
  }
  .grid-scroll { overflow-x: auto !important; overscroll-behavior-x: contain; }

  /* Suwak — widoczny i wygodny, nie domyślna nitka */
  .grid-scroll { scrollbar-width: thin; scrollbar-color: var(--border-strong, #cfc9bd) transparent; }
  .grid-scroll::-webkit-scrollbar { height: 10px; }
  .grid-scroll::-webkit-scrollbar-track { background: transparent; }
  .grid-scroll::-webkit-scrollbar-thumb {
    background: var(--border-strong, #cfc9bd);
    border-radius: 999px;
    border: 3px solid transparent;
    background-clip: content-box;
  }
  .grid-scroll::-webkit-scrollbar-thumb:hover { background: var(--muted, #736e64); background-clip: content-box; }

  /* Przy wąskiej siatce zmniejsz typografię kart zmian, żeby godziny
     mieściły się w jednym wierszu zamiast się łamać. */
  @container (max-width: 900px) {
    .v1-shift, .v1-empty { padding: 5px !important; overflow: hidden; }
    .v1-shift { font-size: 10.5px !important; letter-spacing: -0.15px; }
    .v1-shift * { max-width: 100%; }
    .v1-emp { padding: 8px !important; }
  }

  /* ---- „Na zmianie” — poświata zamiast markera ----------------------
     Najpierw była kropka w rogu (zajmowała miejsce w polu), potem pasek
     przy krawędzi (też wewnątrz pola). Teraz sygnałem jest wyłącznie
     ŚWIATŁO WOKÓŁ kafelka: zewnętrzny box-shadow rozlewa się POZA jego
     obrys, więc nie zabiera ani piksela treści i nic nie przesuwa. */
  .live-dot { display: none !important; }

  @keyframes live-glow {
    0%, 100% { box-shadow: 0 0 9px 1px rgba(30, 91, 69, .22), 0 0 0 1px rgba(30, 91, 69, .30); }
    50%      { box-shadow: 0 0 20px 6px rgba(30, 91, 69, .42), 0 0 0 1px rgba(30, 91, 69, .45); }
  }
  .v1-shift.live, .live {
    animation: live-glow 2.2s ease-in-out infinite;
    border-color: var(--anchor) !important;
  }
  @media (prefers-reduced-motion: reduce) {
    .v1-shift.live, .live {
      animation: none;
      box-shadow: 0 0 14px 3px rgba(30, 91, 69, .32), 0 0 0 1px rgba(30, 91, 69, .38);
    }
  }

</style>
<script>
(function () {
  'use strict';

  // Czasy i krzywe 1:1 z artefaktu „Grafik — Docelowy Widok”
  // (animateGridReflow): najpierw ZWIJA SIĘ DO GÓRY cała bieżąca lista,
  // dopiero potem — nigdy równolegle — NOWE WYNIKI SPADAJĄ na swoje
  // miejsca.
  var EXIT_MS = 260, ENTER_MS = 320, GAP_MS = 40;

  // ---------- gdzie animacja w ogóle działa -----------------------------
  // WYŁĄCZNIE siatka Grafiku. Widok Zespołu i Koszty nie są animowane —
  // tam animacja bywała wadliwa, więc została cofnięta: dla tych widoków
  // findListRoot() zwraca null, czyli nie powstaje żadna migawka ani duch.
  function findListRoot() {
    return document.querySelector('.v1-grid:not(.sortanim-ghost)') || null;
  }

  // W siatce Grafiku animujemy WSZYSTKIE kafelki wierszy: pole pracownika
  // (.v1-emp), zmiany (.v1-shift), puste (.v1-empty) ORAZ nieobecności
  // (.v1-leave — L4/URLOP). Nie wybieramy ich po liście klas (na tym
  // polegał błąd: .v1-leave nie było na liście, więc pola L4 nie
  // znikały, nie animowały się i wisiały do końca), tylko strukturalnie:
  // wszystko, co leży w wierszach siatki. Statyczne zostają nagłówki dni
  // (.v1-dayhead), pusty narożnik i pasek pokrycia.
  function isGrid(el) {
    return !!(el && el.classList && el.classList.contains('v1-grid'));
  }

  function gridCells(grid) {
    var out = [];
    Array.prototype.forEach.call(grid.children, function (ch) {
      if (!ch.classList) return;
      if (ch.classList.contains('v1-dayhead')) return;      // nagłówki dni — statyczne
      if (ch.classList.contains('contents')) {              // wiersz pracownika
        Array.prototype.push.apply(out, Array.prototype.slice.call(ch.children));
      }
    });
    return out;
  }

  function animatedRows(root) {
    if (isGrid(root)) {
      return gridCells(root);
    }
    var secs = root.querySelectorAll('section');
    var rows = [];
    if (secs.length) {
      Array.prototype.forEach.call(secs, function (s) {
        Array.prototype.push.apply(rows, Array.prototype.slice.call(s.children));
      });
    }
    if (!rows.length) rows = Array.prototype.slice.call(root.children);
    return rows;
  }

  function signature(root) {
    if (!root) return '';
    return animatedRows(root).map(function (el) {
      return (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40);
    }).join('|');
  }

  // ---------- sama animacja --------------------------------------------
  var running = null;

  function clipTo(root, ghost, rect) {
    var clipper = root.parentElement;
    while (clipper && clipper !== document.body) {
      var cs = getComputedStyle(clipper);
      if (/hidden|auto|scroll|clip/.test(cs.overflow + cs.overflowX + cs.overflowY)) break;
      clipper = clipper.parentElement;
    }
    if (clipper && clipper !== document.body) {
      var cr = clipper.getBoundingClientRect();
      var t = Math.max(0, cr.top - rect.top);
      var l = Math.max(0, cr.left - rect.left);
      var bm = Math.max(0, (rect.top + rect.height) - (cr.top + cr.height));
      var rm = Math.max(0, (rect.left + rect.width) - (cr.left + cr.width));
      ghost.style.clipPath = 'inset(' + t + 'px ' + rm + 'px ' + bm + 'px ' + l + 'px)';
    }
  }

  function play(root, snap) {
    if (!root) return;
    if (running) { running.cleanup(); running = null; }

    var rect = (snap && snap.rect) || root.getBoundingClientRect();
    if (rect.height < 8) return;

    var gridMode = isGrid(root);

    var ghost = (snap && snap.clone) ? snap.clone : root.cloneNode(true);
    ghost.classList.add('sortanim-ghost');
    // !important, bo layout aplikacji jest scope'owany (`.gk-pc .v1-grid`
    // ma wyższą specyficzność niż `.sortanim-ghost` i narzucał ghostowi
    // `position: relative` — kopia wpadała wtedy w normalny przepływ i
    // rozjeżdżała stronę zamiast leżeć nad nią).
    ghost.style.setProperty('position', 'fixed', 'important');
    ghost.style.setProperty('left', rect.left + 'px', 'important');
    ghost.style.setProperty('top', rect.top + 'px', 'important');
    ghost.style.setProperty('width', rect.width + 'px', 'important');
    ghost.style.setProperty('height', rect.height + 'px', 'important');
    ghost.style.setProperty('margin', '0', 'important');
    ghost.style.setProperty('z-index', '60', 'important');
    clipTo(root, ghost, rect);

    // Duch musi zostać W TYM SAMYM drzewie co oryginał — layout jest
    // scope'owany selektorami `.gk-pc ...`, więc kopia doklejona do <body>
    // traciłaby komplet stylów.
    (root.parentElement || document.body).appendChild(ghost);
    var gr = ghost.getBoundingClientRect();
    var dx = rect.left - gr.left, dy = rect.top - gr.top;
    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
      ghost.style.setProperty('left', (rect.left + dx) + 'px', 'important');
      ghost.style.setProperty('top', (rect.top + dy) + 'px', 'important');
    }

    var prevVis = root.style.visibility, prevH = root.style.height, prevOv = root.style.overflow;
    var phase1 = true;

    if (gridMode) {
      // Statyczne pozostaje wszystko poza kafelkami zmian: w duchu chowamy
      // nagłówki dni i kolumnę pracowników, a w prawdziwej siatce chowamy
      // tylko kafelki zmian. Dzięki temu szkielet siatki ani drgnie.
      Array.prototype.forEach.call(ghost.querySelectorAll('.v1-dayhead'), function (el) {
        el.style.setProperty('visibility', 'hidden', 'important');
      });
      var hideLiveCells = function () {
        if (!phase1) return;
        var live = root.isConnected ? root : findListRoot();
        if (live && isGrid(live)) {
          gridCells(live).forEach(function (el) { el.style.visibility = 'hidden'; });
        }
        requestAnimationFrame(hideLiveCells);
      };
      hideLiveCells();
    } else {
      root.style.visibility = 'hidden';
      root.style.height = rect.height + 'px';
      root.style.overflow = 'hidden';
    }

    // FAZA 1 — zwijanie do góry (transform-origin: top).
    var ghostRows = animatedRows(ghost);
    ghostRows.forEach(function (el) {
      el.style.transformOrigin = 'top';
      el.style.willChange = 'transform, opacity';
    });
    requestAnimationFrame(function () {
      ghostRows.forEach(function (el) {
        el.style.transition = 'transform ' + EXIT_MS + 'ms var(--sortanim-ease-in-out), opacity ' + EXIT_MS + 'ms var(--sortanim-ease-in-out)';
        el.style.transform = 'scaleY(0)';
        el.style.opacity = '0';
      });
    });

    function restoreRoot(node) {
      node.style.visibility = prevVis;
      node.style.height = prevH;
      node.style.overflow = prevOv;
      node.style.transition = '';
    }

    var timer = setTimeout(function () {
      phase1 = false;
      if (ghost.parentNode) ghost.parentNode.removeChild(ghost);

      // Root mógł zostać w międzyczasie podmieniony przez Reacta.
      var live = (root.isConnected ? root : findListRoot()) || root;
      if (!gridMode && live !== root) restoreRoot(root);

      if (!gridMode) {
        live.style.visibility = '';
        live.style.height = 'auto';
      }
      var targetH = gridMode ? 0 : live.getBoundingClientRect().height;

      // FAZA 2 — nowe kafelki spadają na miejsce.
      var rows = animatedRows(live);
      rows.forEach(function (el) {
        el.style.visibility = '';
        el.style.transformOrigin = 'top';
        el.style.transition = 'none';
        el.style.transform = 'scaleY(0) translateY(-8px)';
        el.style.opacity = '0';
        el.style.willChange = 'transform, opacity';
      });

      if (!gridMode) {
        live.style.height = rect.height + 'px';
        void live.offsetHeight;
        live.style.transition = 'height ' + ENTER_MS + 'ms var(--sortanim-ease-out)';
        live.style.height = targetH + 'px';
      }

      requestAnimationFrame(function () {
        rows.forEach(function (el) {
          el.style.transition = 'transform ' + ENTER_MS + 'ms var(--sortanim-ease-out), opacity ' + ENTER_MS + 'ms var(--sortanim-ease-out)';
          el.style.transform = '';
          el.style.opacity = '1';
        });
      });

      function done() {
        rows.forEach(function (el) {
          el.style.transition = ''; el.style.transform = '';
          el.style.transformOrigin = ''; el.style.opacity = '';
          el.style.willChange = ''; el.style.visibility = '';
        });
        if (!gridMode) {
          live.style.visibility = ''; live.style.height = ''; live.style.overflow = ''; live.style.transition = '';
        }
        running = null;
        lastSig = signature(findListRoot());
      }
      var settle = setTimeout(done, ENTER_MS + 40);
      running = { cleanup: function () { clearTimeout(settle); done(); } };
    }, EXIT_MS + GAP_MS);

    running = { cleanup: function () {
      clearTimeout(timer);
      phase1 = false;
      if (ghost.parentNode) ghost.parentNode.removeChild(ghost);
      if (gridMode) {
        var live2 = (root.isConnected ? root : findListRoot());
        if (live2 && isGrid(live2)) gridCells(live2).forEach(function (el) {
          el.style.visibility = ''; el.style.transform = ''; el.style.opacity = '';
          el.style.transition = ''; el.style.transformOrigin = ''; el.style.willChange = '';
        });
      } else {
        restoreRoot(root);
      }
      running = null;
      lastSig = signature(findListRoot());
    } };
  }

  // ---------- wyzwalanie ------------------------------------------------
  // Nie zgadujemy, który przycisk „jest sortowaniem”, i nie trzymamy
  // referencji do węzła listy. Przy każdym wciśnięciu przycisku myszy /
  // klawisza robimy migawkę (kopia listy + podpis treści), a MutationObserver
  // pilnuje, kiedy lista faktycznie zmieni układ — wtedy odtwarzamy
  // animację z tej migawki. Działa dla menu sortowania, przycisku
  // cyklicznego, skrótów, filtrów i wyszukiwarki — także wtedy, gdy React
  // podmienia cały kontener listy.
  var snapshot = null;   // { rect, clone, sig, at }
  var lastSig = '';
  var SNAP_TTL = 2000;

  function takeSnapshot() {
    if (running) return;
    var root = findListRoot();
    if (!root) return;
    var rect = root.getBoundingClientRect();
    if (rect.height < 8) return;
    lastSig = signature(root);
    snapshot = { rect: rect, sig: lastSig, clone: root.cloneNode(true), at: Date.now() };
  }

  document.addEventListener('pointerdown', takeSnapshot, true);
  document.addEventListener('mousedown', takeSnapshot, true);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown' || e.key === 'ArrowUp') takeSnapshot();
  }, true);

  var scheduled = false;
  function checkSoon() {
    if (scheduled || running) return;
    scheduled = true;
    requestAnimationFrame(function () {
      scheduled = false;
      if (running) return;
      var root = findListRoot();
      if (!root) return;
      var sig = signature(root);
      if (sig === lastSig) return;
      if (snapshot && (Date.now() - snapshot.at) < SNAP_TTL && snapshot.sig !== sig) {
        var snap = snapshot;
        snapshot = null;
        lastSig = sig;
        play(root, snap);
      } else {
        lastSig = sig;   // zmiana bez interakcji (np. zegar) — tylko odnotuj
      }
    });
  }

  function boot() {
    lastSig = signature(findListRoot());
    var mo = new MutationObserver(function (muts) {
      for (var i = 0; i < muts.length; i++) {
        var t = muts[i].target;
        if (t && t.nodeType === 1 && t.closest && t.closest('.sortanim-ghost')) continue;
        checkSoon();
        return;
      }
    });
    mo.observe(document.body, { childList: true, subtree: true, characterData: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 400); });
  } else {
    setTimeout(boot, 400);
  }
})();
</script>
