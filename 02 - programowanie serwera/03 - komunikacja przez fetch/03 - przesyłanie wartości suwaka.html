<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .container {
            align-items: center;
            display: flex;
            flex-direction: column;
            width: 30%;
            padding: 2em;
            border: 1px solid black;
            border-radius: 10px;
            background-color: cornflowerblue;
            color: white;
        }
        select,h1 {
            margin-bottom: 2em;
            
        }

        h1 {
            border: 1px solid orange;
            padding: 1em;
            border-radius: 10px;
            
            background-color: orange;
        }

        #btn {
            border: 1px solid orange;
            padding: 1em;
            border-radius: 10px;
            
            background-color: orange;
        }
        #btn:active {
            background-color: purple;
        }
        select {
            width: 100%;
            padding: 2em;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fetch</h1>
        <input type="range" id="r1" value="">
        <input type="range" id="r2" value="">
    </div>
</body>
<script>
    document.getElementById('r1').onchange = function() {
        console.log("wweee")
        const data = JSON.stringify({r1val: document.getElementById('r1').value})
        const options = {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: data
        }
        fetch("/range", options)
            .then(function (response) {
                return response.json()
                console.log('wees')
            })
            .then(function(dataFromServer){
                document.getElementById('r2').value = JSON.stringify(dataFromServer) 
            })
            .catch(function(error){
                console.log(error)
            })
    }
</script>
</html>
