<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="but">www</button>
    <script>
        let game_beginign = 0
        let timer_interval = null
        

        function get_time(){
            let overall_sec = Math.floor((Date.now() - game_beginign)/1000);
            let minutes = Math.floor(overall_sec / 60 )
            let seconds = overall_sec % 60

            return {minutes,seconds}
        }

        function update_time(){
            clearInterval(timer_interval)
            game_beginign = Date.now()

            timer_interval = setInterval(() => {
                time = get_time()
                console.log(time)
            }, 250);
        }


        function stop_timer(){
            clearInterval(timer_interval)
            return get_time()
        }

        const but = document.getElementById('but')
        but.onclick = function(){
            
            console.log(stop_timer())
        }
        update_time()
    </script>

</body>
</html>
