<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        #start {
            padding: 1em;
            width: 50px;
            background-color: green;
            color: white;
            text-align: center;
            border-radius: 15px;
            
        }

        #bar {
            border: 2px solid black;
            width: 50%;
            height: 50px;
            margin: 1em;
            border-radius: 15px;
            overflow: hidden;
        }
        #progress {
            background-color: green;
            width: 0%;
            height: inherit;
        }
    </style>
</head>
<body>
    <div id="start">START</div>
    <div id="bar">
        <div id="progress"></div>
    </div>
    <script>
        const start = document.getElementById('start')
        const progressBar = document.getElementById('progress')


        let percetage_fill = 0
        let progres_interval
        start.addEventListener('click', function(){
            clearInterval(progres_interval)
            percetage_fill = 0
            progres_interval = setInterval(function(){
                percetage_fill += 0.1
                console.log(percetage_fill)
                progressBar.style.width = percetage_fill + '%'
                if (percetage_fill >= 100){
                    clearInterval(progres_interval)
                }
            },1)
        })
    </script>
</body>
</html>
