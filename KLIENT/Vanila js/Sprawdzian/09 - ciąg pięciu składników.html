<body>
    <script>
        function pent(n){
            let sequence_times = n
            if ( sequence_times <= 0  ){
                return console.log('wiesza od zera')
            }
            let starting_index = 0
            let ending_index = 5
            let ciag = [0, 1, 1, 2, 4]
            for (let i =0; i < sequence_times; i++){
                let number_to_list = 0
                for(let j = starting_index;j < ending_index;j++){
                    console.log(j)
                    number_to_list += ciag[j]
                }
                starting_index++
                ending_index++
                ciag.push(number_to_list)
            }
            console.log(ciag.slice(0,sequence_times))

        }
        pent(6)
    </script>
