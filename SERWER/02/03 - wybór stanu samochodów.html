<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zad 05: Samochody</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 600;
        }
        h2 {
            color: #666;
            font-size: 18px;
            font-weight: 500;
            margin: 0 0 20px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        th {
            background-color: #1e88e5;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: 500;
        }
        th:first-child {
            text-align: center;
            width: 50px;
        }
        th:nth-child(2) {
            text-align: left;
            width: 150px;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            text-align: center;
        }
        td:nth-child(2) {
            text-align: left;
            color: #666;
        }
        input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        button {
            background-color: #4caf50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>zad 05: samochody</h1>
        <h2>Wybierz stan samochodów</h2>
        
        <form method="post" action="/handleform">
            <table>
                <thead>
                    <tr>
                        <th></th>
                        <th></th>
                        <th>nowych</th>
                        <th>używanych</th>
                        <th>powypadkowych</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>audi</td>
                        <td><input type="radio" name="audi" value="new"></td>
                        <td><input type="radio" name="audi" value="used"></td>
                        <td><input type="radio" name="audi" value="acident"></td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>opel</td>
                        <td><input type="radio" name="opel" value="new"></td>
                        <td><input type="radio" name="opel" value="used"></td>
                        <td><input type="radio" name="opel" value="acident"></td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>francuz</td>
                        <td><input type="radio" name="francuz" value="new"></td>
                        <td><input type="radio" name="francuz" value="used"></td>
                        <td><input type="radio" name="francuz" value="acident"></td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>duży fiat</td>
                        <td><input type="radio" name="duzy_fiat" value="new"></td>
                        <td><input type="radio" name="duzy_fiat" value="used"></td>
                        <td><input type="radio" name="duzy_fiat" value="acident"></td>
                    </tr>
                    <tr>
                        <td>5</td>
                        <td>mercedes</td>
                        <td><input type="radio" name="mercedes" value="new"></td>
                        <td><input type="radio" name="mercedes" value="used"></td>
                        <td><input type="radio" name="mercedes" value="acident"></td>
                    </tr>
                    <tr>
                        <td>6</td>
                        <td>małe fajne autko</td>
                        <td><input type="radio" name="male_fajne" value="new"></td>
                        <td><input type="radio" name="male_fajne" value="used"></td>
                        <td><input type="radio" name="male_fajne" value="acident"></td>
                    </tr>
                </tbody>
            </table>

            <button type="submit">send</button>
        </form>
    </div>
</body>
</html>
